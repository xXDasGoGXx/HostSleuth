name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Web JS syntax
        run: |
          node --check cmd/hostsleuth/web/app.js
          node --check cmd/hostsleuth/web/service_story.js
          node --check cmd/hostsleuth/web/incident_lens.js
          node --check cmd/hostsleuth/web/reboot_story.js
          node --check cmd/hostsleuth/web/workbench.js
          node --check cmd/hostsleuth/web/endpoint_contract.js
          node --check cmd/hostsleuth/web/dns_detective.js
          node --check cmd/hostsleuth/web/proxy_story.js
          node --check cmd/hostsleuth/web/permissions_story.js
          node --check cmd/hostsleuth/web/starttls_story.js
          node --check cmd/hostsleuth/web/certificate_rollout.js
          node --check cmd/hostsleuth/web/actions.js
          node --check cmd/hostsleuth/web/admin_console.js
          node --check cmd/hostsleuth/web/admin_console_v2.js
          cat \
            cmd/hostsleuth/web/app.js \
            cmd/hostsleuth/web/service_story.js \
            cmd/hostsleuth/web/incident_lens.js \
            cmd/hostsleuth/web/reboot_story.js \
            cmd/hostsleuth/web/workbench.js \
            cmd/hostsleuth/web/endpoint_contract.js \
            cmd/hostsleuth/web/dns_detective.js \
            cmd/hostsleuth/web/proxy_story.js \
            cmd/hostsleuth/web/permissions_story.js \
            cmd/hostsleuth/web/starttls_story.js \
            cmd/hostsleuth/web/certificate_rollout.js \
            cmd/hostsleuth/web/actions.js \
            cmd/hostsleuth/web/admin_console.js \
            cmd/hostsleuth/web/admin_console_v2.js \
            > /tmp/hostsleuth-served-app.js
          node --check /tmp/hostsleuth-served-app.js
      - name: Build
        run: go build -trimpath -o hostsleuth ./cmd/hostsleuth

  native-actions-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build native HostSleuth
        run: go build -trimpath -o hostsleuth ./cmd/hostsleuth
      - name: Create disposable systemd service
        run: |
          set -eu
          sudo tee /etc/systemd/system/hostsleuth-m11-accept.service >/dev/null <<'EOF'
          [Unit]
          Description=HostSleuth M11 disposable action acceptance

          [Service]
          Type=simple
          ExecStart=/bin/sleep infinity
          ExecReload=/bin/true
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start hostsleuth-m11-accept.service
          sudo systemctl is-active --quiet hostsleuth-m11-accept.service
      - name: Verify preview confirmation audit and real restart
        run: |
          set -eu
          state=/tmp/hostsleuth-m11-action-state
          sudo mkdir -p "$state"

          sudo ./hostsleuth action preview \
            --state-dir "$state" \
            --enable-actions \
            --allow-restart-service hostsleuth-m11-accept \
            --target hostsleuth-m11-accept.service \
            > /tmp/hostsleuth-m11-preview.json

          before_pid=$(sudo systemctl show hostsleuth-m11-accept.service --property=MainPID --value)
          test -n "$before_pid"
          test "$before_pid" != "0"

          set +e
          sudo ./hostsleuth action run \
            --state-dir "$state" \
            --enable-actions \
            --allow-restart-service hostsleuth-m11-accept \
            --target hostsleuth-m11-accept.service \
            --confirm WRONG \
            > /tmp/hostsleuth-m11-denied.json 2>/tmp/hostsleuth-m11-denied.err
          denied_rc=$?
          set -e
          test "$denied_rc" -ne 0

          after_denied_pid=$(sudo systemctl show hostsleuth-m11-accept.service --property=MainPID --value)
          test "$before_pid" = "$after_denied_pid"

          sudo ./hostsleuth action run \
            --state-dir "$state" \
            --enable-actions \
            --allow-restart-service hostsleuth-m11-accept \
            --target hostsleuth-m11-accept.service \
            --confirm 'RESTART hostsleuth-m11-accept.service' \
            > /tmp/hostsleuth-m11-run.json

          after_pid=$(sudo systemctl show hostsleuth-m11-accept.service --property=MainPID --value)
          test -n "$after_pid"
          test "$after_pid" != "0"
          test "$before_pid" != "$after_pid"

          sudo ./hostsleuth action audit \
            --state-dir "$state" \
            --limit 10 \
            > /tmp/hostsleuth-m11-audit.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          preview = json.loads(Path('/tmp/hostsleuth-m11-preview.json').read_text())
          assert preview['available'] is True, preview
          assert preview['allowed'] is True, preview
          assert preview['confirmation'] == 'RESTART hostsleuth-m11-accept.service', preview
          assert preview['command'][0] in ('/usr/bin/systemctl', '/bin/systemctl'), preview
          assert preview['command'][1:] == ['restart', 'hostsleuth-m11-accept.service'], preview

          denied = json.loads(Path('/tmp/hostsleuth-m11-denied.json').read_text())
          assert denied['status'] == 'denied', denied

          result = json.loads(Path('/tmp/hostsleuth-m11-run.json').read_text())
          assert result['status'] == 'success', result
          assert result['before']['active_state'] == 'active', result
          assert result['after']['active_state'] == 'active', result

          audits = json.loads(Path('/tmp/hostsleuth-m11-audit.json').read_text())
          assert len(audits) == 3, audits
          assert audits[0]['phase'] == 'denied' and audits[0]['status'] == 'denied', audits
          assert audits[1]['phase'] == 'requested' and audits[1]['status'] == 'requested', audits
          assert audits[2]['phase'] == 'completed' and audits[2]['status'] == 'success', audits
          PY
      - name: Verify independent allowlist and real reload
        run: |
          set -eu
          state=/tmp/hostsleuth-m18-reload-state
          sudo mkdir -p "$state"

          sudo ./hostsleuth action preview \
            --state-dir "$state" \
            --enable-actions \
            --allow-restart-service hostsleuth-m11-accept \
            --id service.reload \
            --target hostsleuth-m11-accept.service \
            > /tmp/hostsleuth-m18-reload-denied-preview.json

          sudo ./hostsleuth action preview \
            --state-dir "$state" \
            --enable-actions \
            --allow-reload-service hostsleuth-m11-accept \
            --id service.reload \
            --target hostsleuth-m11-accept.service \
            > /tmp/hostsleuth-m18-reload-preview.json

          before_reload_pid=$(sudo systemctl show hostsleuth-m11-accept.service --property=MainPID --value)
          test -n "$before_reload_pid"
          test "$before_reload_pid" != "0"

          sudo ./hostsleuth action run \
            --state-dir "$state" \
            --enable-actions \
            --allow-reload-service hostsleuth-m11-accept \
            --id service.reload \
            --target hostsleuth-m11-accept.service \
            --confirm 'RELOAD hostsleuth-m11-accept.service' \
            > /tmp/hostsleuth-m18-reload-run.json

          after_reload_pid=$(sudo systemctl show hostsleuth-m11-accept.service --property=MainPID --value)
          test "$before_reload_pid" = "$after_reload_pid"
          sudo systemctl is-active --quiet hostsleuth-m11-accept.service

          sudo ./hostsleuth action audit \
            --state-dir "$state" \
            --limit 10 \
            > /tmp/hostsleuth-m18-reload-audit.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          denied_preview = json.loads(Path('/tmp/hostsleuth-m18-reload-denied-preview.json').read_text())
          assert denied_preview['available'] is False, denied_preview
          assert denied_preview['allowed'] is False, denied_preview

          preview = json.loads(Path('/tmp/hostsleuth-m18-reload-preview.json').read_text())
          assert preview['available'] is True, preview
          assert preview['allowed'] is True, preview
          assert preview['confirmation'] == 'RELOAD hostsleuth-m11-accept.service', preview
          assert preview['command'][0] in ('/usr/bin/systemctl', '/bin/systemctl'), preview
          assert preview['command'][1:] == ['reload', 'hostsleuth-m11-accept.service'], preview
          reload_check = next(item for item in preview['checks'] if item['name'] == 'reload-capability')
          assert reload_check['status'] == 'pass', preview

          result = json.loads(Path('/tmp/hostsleuth-m18-reload-run.json').read_text())
          assert result['status'] == 'success', result
          assert result['action_id'] == 'service.reload', result
          assert result['before']['active_state'] == 'active', result
          assert result['after']['active_state'] == 'active', result
          assert 'reload command succeeded' in result['summary'], result

          audits = json.loads(Path('/tmp/hostsleuth-m18-reload-audit.json').read_text())
          assert len(audits) == 2, audits
          assert audits[0]['phase'] == 'requested' and audits[0]['action_id'] == 'service.reload', audits
          assert audits[1]['phase'] == 'completed' and audits[1]['status'] == 'success', audits
          PY
      - name: Remove disposable systemd service
        if: always()
        run: |
          sudo systemctl stop hostsleuth-m11-accept.service 2>/dev/null || true
          sudo rm -f /etc/systemd/system/hostsleuth-m11-accept.service
          sudo systemctl daemon-reload

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        if: matrix.platform == 'linux/amd64'
        run: docker compose config --quiet
      - name: Create buildx builder
        run: docker buildx create --use --name hostsleuth-ci
      - name: Build image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg VERSION=0.1.0-ci \
            --output type=oci,dest=/tmp/hostsleuth-image.tar \
            .

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image users will consume
        run: docker build --build-arg VERSION=0.1.0-ci -t hostsleuth:ci .
      - name: Start supported Compose deployment from image
        env:
          HOSTSLEUTH_IMAGE: hostsleuth:ci
        run: docker compose up -d
      - name: Wait for HostSleuth API
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/about > /tmp/hostsleuth-about.json && \
               curl -fsS http://127.0.0.1:8787/api/snapshot > /tmp/hostsleuth-snapshot.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs hostsleuth
          exit 1
      - name: Verify image version and Docker-mode snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          about = json.loads(Path('/tmp/hostsleuth-about.json').read_text())
          assert about.get('version') == '0.1.0-ci', about

          snapshot = json.loads(Path('/tmp/hostsleuth-snapshot.json').read_text())
          assert snapshot.get('mode') == 'docker', snapshot
          assert snapshot.get('host', {}).get('hostname'), snapshot
          assert snapshot.get('interfaces') is not None, snapshot
          assert not snapshot.get('services'), snapshot
          assert not snapshot.get('filesystems'), snapshot
          PY
      - name: Verify Web UI self-diagnosis Workbench and Safe Actions boundary
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8787/ | grep -q 'HostSleuth'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'HOSTSLEUTH WORKBENCH'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'REBOOT STORY'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'OPTIONAL SAFE ACTIONS'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'EXPECTED ENDPOINT CONTRACT'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'DNS DETECTIVE'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'REVERSE PROXY / UPSTREAM STORY'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'DEPLOYMENT / PERMISSIONS STORY'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'STARTTLS / MAIL SERVICE STORY'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'CERTIFICATE ROLLOUT VERIFICATION'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'Quick target'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'globalProxy'
          curl -fsS http://127.0.0.1:8787/api/reboot-story > /tmp/hostsleuth-reboot-story.json
          curl -fsS 'http://127.0.0.1:8787/api/dns-detective?name=localhost' > /tmp/hostsleuth-dns-detective.json
          curl -fsS --get \
            --data-urlencode 'public=http://127.0.0.1:8787/' \
            --data-urlencode 'upstream=http://localhost:8787/' \
            http://127.0.0.1:8787/api/proxy-story > /tmp/hostsleuth-proxy-story.json
          curl -fsS --get \
            --data-urlencode 'service=ssh.service' \
            --data-urlencode 'path=/host/etc/os-release' \
            http://127.0.0.1:8787/api/permissions-story > /tmp/hostsleuth-permissions-story.json
          starttls_status=$(curl -sS -o /tmp/hostsleuth-starttls-invalid.txt -w '%{http_code}' --get \
            --data-urlencode 'protocol=smtp' \
            --data-urlencode 'target=missing-port' \
            http://127.0.0.1:8787/api/starttls-story)
          test "$starttls_status" = 400
          cert_rollout_status=$(curl -sS -o /tmp/hostsleuth-cert-rollout-invalid.txt -w '%{http_code}' --get \
            --data-urlencode 'fingerprint=abcd' \
            --data-urlencode 'endpoint=localhost:443' \
            http://127.0.0.1:8787/api/certificate-rollout)
          test "$cert_rollout_status" = 400
          curl -fsS http://127.0.0.1:8787/api/actions > /tmp/hostsleuth-actions.json
          curl -fsS 'http://127.0.0.1:8787/api/diagnose?target=127.0.0.1:8787' > /tmp/hostsleuth-diagnosis.json
          curl -fsS --get --data-urlencode 'path=/host/etc/os-release' 'http://127.0.0.1:8787/api/workbench/file' > /tmp/hostsleuth-workbench-file.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          diagnosis = json.loads(Path('/tmp/hostsleuth-diagnosis.json').read_text())
          assert diagnosis.get('conclusion') == 'target is reachable', diagnosis
          assert diagnosis.get('confidence') == 'high', diagnosis

          reboot_story = json.loads(Path('/tmp/hostsleuth-reboot-story.json').read_text())
          assert reboot_story.get('boot_id'), reboot_story
          assert reboot_story.get('boot_started_at'), reboot_story
          assert reboot_story.get('cause_assessment'), reboot_story

          dns = json.loads(Path('/tmp/hostsleuth-dns-detective.json').read_text())
          assert dns.get('status') == 'single', dns
          assert dns.get('resolvers', [{}])[0].get('label') == 'system', dns
          assert dns.get('resolvers', [{}])[0].get('status') == 'pass', dns

          permissions = json.loads(Path('/tmp/hostsleuth-permissions-story.json').read_text())
          assert permissions.get('status') == 'unknown', permissions
          assert 'Docker deployment mode' in permissions.get('conclusion', ''), permissions

          proxy = json.loads(Path('/tmp/hostsleuth-proxy-story.json').read_text())
          assert proxy.get('status') == 'pass', proxy
          assert proxy.get('public_target') == '127.0.0.1:8787', proxy
          assert proxy.get('upstream_target') == 'localhost:8787', proxy
          stage_ids = [item.get('id') for item in proxy.get('stages', [])]
          assert 'public-http' in stage_ids and 'upstream-http' in stage_ids, proxy

          file_evidence = json.loads(Path('/tmp/hostsleuth-workbench-file.json').read_text())
          assert len(file_evidence.get('sha256', '')) == 64, file_evidence
          assert len(file_evidence.get('sha512', '')) == 128, file_evidence

          actions = json.loads(Path('/tmp/hostsleuth-actions.json').read_text())
          restart = next(item for item in actions if item.get('action_id') == 'service.restart')
          reload = next(item for item in actions if item.get('action_id') == 'service.reload')
          assert restart.get('enabled') is False, restart
          assert restart.get('available') is False, restart
          assert restart.get('allowed_targets') in (None, []), restart
          assert reload.get('enabled') is False, reload
          assert reload.get('available') is False, reload
          assert reload.get('allowed_targets') in (None, []), reload
          PY
      - name: Show logs on failure
        if: failure()
        run: docker compose logs hostsleuth
      - name: Stop Compose deployment
        if: always()
        run: docker compose down -v --remove-orphans
