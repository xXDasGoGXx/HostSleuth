name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Web JS syntax
        run: node --check cmd/hostsleuth/web/app.js
      - name: Build
        run: go build -trimpath -o hostsleuth ./cmd/hostsleuth

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        if: matrix.platform == 'linux/amd64'
        run: docker compose config --quiet
      - name: Create buildx builder
        run: docker buildx create --use --name hostsleuth-ci
      - name: Build image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg VERSION=0.1.0-ci \
            --output type=oci,dest=/tmp/hostsleuth-image.tar \
            .
