name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Web JS syntax
        run: |
          node --check cmd/hostsleuth/web/app.js
          node --check cmd/hostsleuth/web/service_story.js
          node --check cmd/hostsleuth/web/incident_lens.js
          node --check cmd/hostsleuth/web/reboot_story.js
          node --check cmd/hostsleuth/web/workbench.js
          cat \
            cmd/hostsleuth/web/app.js \
            cmd/hostsleuth/web/service_story.js \
            cmd/hostsleuth/web/incident_lens.js \
            cmd/hostsleuth/web/reboot_story.js \
            cmd/hostsleuth/web/workbench.js \
            > /tmp/hostsleuth-served-app.js
          node --check /tmp/hostsleuth-served-app.js
      - name: Build
        run: go build -trimpath -o hostsleuth ./cmd/hostsleuth

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        if: matrix.platform == 'linux/amd64'
        run: docker compose config --quiet
      - name: Create buildx builder
        run: docker buildx create --use --name hostsleuth-ci
      - name: Build image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg VERSION=0.1.0-ci \
            --output type=oci,dest=/tmp/hostsleuth-image.tar \
            .

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image users will consume
        run: docker build --build-arg VERSION=0.1.0-ci -t hostsleuth:ci .
      - name: Start supported Compose deployment from image
        env:
          HOSTSLEUTH_IMAGE: hostsleuth:ci
        run: docker compose up -d
      - name: Wait for HostSleuth API
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/about > /tmp/hostsleuth-about.json && \
               curl -fsS http://127.0.0.1:8787/api/snapshot > /tmp/hostsleuth-snapshot.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs hostsleuth
          exit 1
      - name: Verify image version and Docker-mode snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          about = json.loads(Path('/tmp/hostsleuth-about.json').read_text())
          assert about.get('version') == '0.1.0-ci', about

          snapshot = json.loads(Path('/tmp/hostsleuth-snapshot.json').read_text())
          assert snapshot.get('mode') == 'docker', snapshot
          assert snapshot.get('host', {}).get('hostname'), snapshot
          assert snapshot.get('interfaces') is not None, snapshot
          assert not snapshot.get('services'), snapshot
          assert not snapshot.get('filesystems'), snapshot
          PY
      - name: Verify Web UI self-diagnosis and Workbench
        run: |
          set -eu
          curl -fsS http://127.0.0.1:8787/ | grep -q 'HostSleuth'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'HOSTSLEUTH WORKBENCH'
          curl -fsS http://127.0.0.1:8787/assets/app.js | grep -q 'REBOOT STORY'
          curl -fsS http://127.0.0.1:8787/api/reboot-story > /tmp/hostsleuth-reboot-story.json
          curl -fsS 'http://127.0.0.1:8787/api/diagnose?target=127.0.0.1:8787' > /tmp/hostsleuth-diagnosis.json
          curl -fsS --get --data-urlencode 'path=/host/etc/os-release' 'http://127.0.0.1:8787/api/workbench/file' > /tmp/hostsleuth-workbench-file.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          diagnosis = json.loads(Path('/tmp/hostsleuth-diagnosis.json').read_text())
          assert diagnosis.get('conclusion') == 'target is reachable', diagnosis
          assert diagnosis.get('confidence') == 'high', diagnosis

          reboot_story = json.loads(Path('/tmp/hostsleuth-reboot-story.json').read_text())
          assert reboot_story.get('boot_id'), reboot_story
          assert reboot_story.get('boot_started_at'), reboot_story
          assert reboot_story.get('cause_assessment'), reboot_story

          file_evidence = json.loads(Path('/tmp/hostsleuth-workbench-file.json').read_text())
          assert len(file_evidence.get('sha256', '')) == 64, file_evidence
          assert len(file_evidence.get('sha512', '')) == 128, file_evidence
          PY
      - name: Show logs on failure
        if: failure()
        run: docker compose logs hostsleuth
      - name: Stop Compose deployment
        if: always()
        run: docker compose down -v --remove-orphans
