name: Release

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Determine release version
        id: meta
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release branch version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_version=${VERSION#v}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/hostsleuth-linux-amd64 ./cmd/hostsleuth
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/hostsleuth-linux-arm64 ./cmd/hostsleuth
          (cd dist && sha256sum hostsleuth-linux-amd64 hostsleuth-linux-arm64 > SHA256SUMS)

      - name: Publish GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          STABLE: ${{ steps.meta.outputs.stable }}
        run: |
          set -eu
          if gh release view "$VERSION" >/dev/null 2>&1; then
            RELEASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha)"
            if [[ "$RELEASE_SHA" != "$GITHUB_SHA" ]]; then
              echo "release $VERSION already points to $RELEASE_SHA, not current branch head $GITHUB_SHA" >&2
              exit 1
            fi
            echo "release $VERSION already exists at the current commit"
          elif [[ "$STABLE" == "true" ]]; then
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "HostSleuth $VERSION" --generate-notes
          else
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "HostSleuth $VERSION" --generate-notes --prerelease
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.meta.outputs.stable == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.stable == 'true'

      - name: Log in to Docker Hub
        if: steps.meta.outputs.stable == 'true'
        uses: docker/login-action@v3
        with:
          username: mjmalleo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish stable multi-platform image
        if: steps.meta.outputs.stable == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            mjmalleo/hostsleuth:${{ steps.meta.outputs.docker_version }}
            mjmalleo/hostsleuth:latest
          labels: |
            org.opencontainers.image.title=HostSleuth
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
