name: Capture README screenshot

on:
  push:
    branches: [acceptance/m3-finalize]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start supported Compose deployment
        env:
          HOSTSLEUTH_VERSION: 0.1.0-ci
        run: docker compose up -d --build
      - name: Wait for HostSleuth UI
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/snapshot >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs hostsleuth
          exit 1
      - name: Capture public-safe Diagnose view
        run: |
          set -eu
          chrome="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$chrome"
          mkdir -p docs/images
          "$chrome" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --window-size=800,520 \
            --screenshot=docs/images/hostsleuth-diagnose.png \
            'http://127.0.0.1:8787/#diagnose'
          test -s docs/images/hostsleuth-diagnose.png
      - name: Stop Compose deployment
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Commit screenshot to acceptance branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/hostsleuth-diagnose.png
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add accepted HostSleuth UI screenshot'
          git push origin HEAD:acceptance/m3-finalize
