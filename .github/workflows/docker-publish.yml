name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Determine stable version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eu
          if [[ "$RELEASE_PRERELEASE" == "false" && "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker publication for non-stable release: tag=$RELEASE_TAG prerelease=$RELEASE_PRERELEASE"
          fi

      - uses: actions/checkout@v4
        if: steps.version.outputs.stable == 'true'
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.stable == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.stable == 'true'

      - name: Log in to Docker Hub
        if: steps.version.outputs.stable == 'true'
        uses: docker/login-action@v3
        with:
          username: mjmalleo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish stable multi-platform image
        if: steps.version.outputs.stable == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: |
            mjmalleo/hostsleuth:${{ steps.version.outputs.version }}
            mjmalleo/hostsleuth:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
